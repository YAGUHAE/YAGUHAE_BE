# EC2 운영 서버용 compose 파일.
# CD 워크플로우가 이 파일과 .env를 서버로 전송한 뒤 pull & up 을 실행한다.
services:
  postgres:
    image: postgres:16-alpine
    container_name: yaguhae-postgres
    restart: unless-stopped
    # 운영 DB는 호스트 포트를 열지 않고 compose 내부 네트워크로만 접근한다.
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - yaguhae_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}']
      interval: 5s
      timeout: 5s
      retries: 10

  # 앱보다 먼저 1회 실행되고 종료되는 마이그레이션 전용 서비스
  migration:
    image: ${APP_IMAGE}
    container_name: yaguhae-migration
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      NODE_ENV: production
    command: ['node_modules/.bin/typeorm', 'migration:run', '-d', 'dist/database/data-source.js']

  app:
    image: ${APP_IMAGE}
    container_name: yaguhae-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      NODE_ENV: production
      PORT: 4000
    # 호스트 포트를 열지 않는다. 외부 트래픽은 nginx만 받는다.
    expose:
      - '4000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    container_name: yaguhae-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '${HTTP_PORT:-80}:80'
      # 인증서가 없어도 포트는 미리 열어둔다. 443 을 듣는 server 블록이 아직
      # 없으므로 연결은 거절되지만, HTTPS 전환 때 compose 를 고칠 필요가 없다.
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # 443 server 블록이 담길 자리. 비어 있으면 include 가 무시된다.
      # conf.d 하위가 아니어야 한다 — 읽기 전용 마운트 안쪽에는 마운트할 수 없다.
      - ./nginx/ssl:/etc/nginx/ssl-conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1/api/v1/health']
      interval: 15s
      timeout: 5s
      retries: 5

  # 인증서 발급·갱신 전용. 평소에는 뜨지 않고 profile 로 명시할 때만 실행된다.
  #   발급: docker compose -f docker-compose.prod.yml --profile certbot run --rm certbot \
  #           certonly --webroot -w /var/www/certbot -d "$DOMAIN" \
  #           --email "$CERTBOT_EMAIL" --agree-tos --no-eff-email
  #   갱신: docker compose -f docker-compose.prod.yml --profile certbot run --rm certbot renew
  certbot:
    image: certbot/certbot:latest
    container_name: yaguhae-certbot
    profiles: ['certbot']
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot

volumes:
  yaguhae_pgdata:
  # 발급받은 인증서. 이 볼륨을 지우면 재발급해야 하며 Let's Encrypt 의
  # 발급 횟수 제한(도메인당 주 5회)에 걸릴 수 있다.
  certbot_conf:
  # HTTP-01 챌린지 토큰이 오가는 곳. nginx 가 읽고 certbot 이 쓴다.
  certbot_www:
