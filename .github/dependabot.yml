# Dependabot 설정. PR은 저장소 기본 브랜치(dev)를 대상으로 열린다.
# 참고: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-reference
version: 2

updates:
  # 워크플로우에서 사용하는 GitHub Actions 버전 업데이트
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    # 커밋 메시지를 CONTRIBUTING.md 의 `<type>: <설명>` 컨벤션에 맞춘다.
    commit-message:
      prefix: chore
    # 액션 업데이트를 하나의 PR로 묶어 리뷰 부담을 줄인다.
    groups:
      github-actions:
        patterns:
          - '*'
    open-pull-requests-limit: 5

  # npm(pnpm) 의존성 보안·버전 업데이트
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Seoul
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    # 프로덕션과 개발 의존성을 나눠 묶는다. 런타임에 실제로 실리는 쪽이
    # 어느 것인지 PR 제목에서 바로 구분돼야 우선순위를 정할 수 있다.
    groups:
      prod-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    # 메이저 업데이트는 그룹에 묶지 않고 개별 PR로 받는다 —
    # 호환성 확인이 필요해 한꺼번에 머지할 수 없다.
    open-pull-requests-limit: 5
    ignore:
      # NestJS 메이저는 생태계 패키지가 함께 올라가야 해서 개별 대응한다.
      - dependency-name: '@nestjs/*'
        update-types: ['version-update:semver-major']
      # @types/node 메이저는 런타임 Node 메이저와 함께 올린다. 타입만 앞서면
      # 그 버전에만 있는 API를 컴파일러가 통과시켜, 빌드는 되는데 운영에서 터진다.
      # 런타임은 Dockerfile 전 스테이지와 CI 모두 Node 24다.
      # Node를 올릴 때 이 규칙을 지운다.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
