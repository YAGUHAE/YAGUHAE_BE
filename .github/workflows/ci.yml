name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint & Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yaguhae_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: yaguhae_test
      # AppModule 부트스트랩이 JWT 시크릿을 요구한다 (없으면 e2e가 기동 단계에서 실패).
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      # KakaoStrategy 가 getOrThrow 로 요구한다 (없으면 e2e 가 기동 단계에서 실패).
      KAKAO_CLIENT_ID: ci-kakao-client-id
      KAKAO_CLIENT_SECRET: ci-kakao-client-secret
      KAKAO_CALLBACK_URL: http://localhost:4000/api/v1/auth/kakao/callback

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v7

      - name: pnpm 설치
        uses: pnpm/action-setup@v6

      - name: Node.js 설치
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 포맷 검사
        run: pnpm format:check

      - name: 린트 검사
        run: pnpm lint:check

      - name: 빌드
        run: pnpm build

      - name: 단위 테스트
        run: pnpm test

      # e2e가 실제 스키마를 쓴다. 이 단계가 없으면 DB를 조회하는 테스트가
      # relation does not exist 로 깨진다. 덤으로 마이그레이션 자체가 매 PR에서
      # 검증된다 — 이전에는 CI가 마이그레이션을 한 번도 실행하지 않았다.
      - name: 마이그레이션 실행
        run: pnpm migration:run

      - name: E2E 테스트
        run: pnpm test:e2e

  docker-build:
    name: Docker 이미지 빌드 검증
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v7

      - name: Buildx 설정
        uses: docker/setup-buildx-action@v4

      - name: 이미지 빌드 (푸시 없음)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
