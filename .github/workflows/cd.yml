name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: 이미지 빌드 & GHCR 푸시
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image-name.outputs.image }}

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v7

      - name: 이미지 이름 계산 (GHCR은 소문자만 허용)
        id: image-name
        run: echo "image=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Buildx 설정
        uses: docker/setup-buildx-action@v4

      - name: GHCR 로그인
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 태그/라벨 생성
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image-name.outputs.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: 빌드 & 푸시
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: EC2 배포
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: read

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v7

      - name: compose 파일 & nginx 설정 서버로 전송
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          # scp-action v1.0.0이 쓰는 drone-scp는 source를 콤마로만 분리한다.
          # 줄바꿈으로 나열하면 한 경로로 합쳐져 매칭되는 파일이 없고
          # "tar: Cowardly refusing to create an empty archive" 로 실패한다.
          source: docker-compose.prod.yml,nginx/conf.d/default.conf
          target: ${{ vars.DEPLOY_PATH || '~/yaguhae' }}

      - name: SSH 접속 후 배포
        uses: appleboy/ssh-action@v1.2.5
        env:
          APP_IMAGE: ${{ needs.build-and-push.outputs.image }}:sha-${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '~/yaguhae' }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          envs: APP_IMAGE,GHCR_USER,GHCR_TOKEN,DEPLOY_PATH
          script_stop: true
          script: |
            set -e
            cd "$DEPLOY_PATH"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # 셸 환경변수가 .env 의 APP_IMAGE 보다 우선 적용된다.
            export APP_IMAGE
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # nginx 설정은 볼륨 마운트라 컨테이너 재생성 없이는 반영되지 않으므로
            # 문법 검사 후 명시적으로 reload 한다.
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -t
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload

            docker image prune -f
            docker logout ghcr.io

      - name: 배포 헬스체크
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '~/yaguhae' }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          envs: DEPLOY_PATH
          script_stop: true
          script: |
            cd "$DEPLOY_PATH"
            HTTP_PORT="$(grep -E '^HTTP_PORT=' .env | cut -d= -f2)"
            HTTP_PORT="${HTTP_PORT:-80}"

            # nginx → app → postgres 전체 경로를 검증한다.
            for i in $(seq 1 20); do
              if curl -fsS "http://127.0.0.1:${HTTP_PORT}/api/v1/health/ready" > /dev/null; then
                echo "헬스체크 성공"
                exit 0
              fi
              echo "헬스체크 대기 중... ($i/20)"
              sleep 5
            done

            echo "헬스체크 실패. 최근 로그를 출력합니다."
            docker compose -f docker-compose.prod.yml logs --tail 100 app nginx
            exit 1
