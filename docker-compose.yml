services:
  postgres:
    image: postgres:16-alpine
    container_name: yaguhae-postgres
    restart: unless-stopped
    ports:
      - '${DB_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-yaguhae}
    volumes:
      - yaguhae_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-yaguhae}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  yaguhae_pgdata:
