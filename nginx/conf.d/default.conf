upstream yaguhae_api {
    # compose 서비스명으로 앱 컨테이너에 접근한다.
    server app:4000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # nginx 버전 노출 방지
    server_tokens off;

    # 업로드 크기 제한 (이미지 업로드가 생기면 조정)
    client_max_body_size 10m;

    gzip on;
    gzip_types application/json application/javascript text/plain text/css;
    gzip_min_length 1024;

    # 헬스체크는 접근 로그를 남기지 않는다 (컨테이너 헬스체크가 15초마다 호출)
    location = /api/v1/health {
        access_log off;
        proxy_pass http://yaguhae_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
    }

    location / {
        proxy_pass http://yaguhae_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # keepalive 업스트림을 쓰므로 Connection 헤더를 비운다.
        proxy_set_header Connection '';

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket이 필요해지면 아래 형태의 location을 추가한다.
    # location /socket.io/ {
    #     proxy_pass http://yaguhae_api;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host $host;
    # }
}
