upstream yaguhae_api {
    # compose 서비스명으로 앱 컨테이너에 접근한다.
    server app:4000;
    keepalive 32;
}

# 인증서가 준비되면 여기에 443 server 블록이 담긴 .conf 파일이 들어온다.
# 파일이 없으면 glob이 아무것도 매칭하지 않고 nginx는 그대로 뜬다 —
# 도메인이 없는 지금도 이 include는 무해하다. (nginx/ssl/README.md 참고)
#
# conf.d 안이 아니라 별도 경로인 이유: conf.d 는 읽기 전용으로 마운트되어 있어
# 그 하위에 또 마운트하면 컨테이너가 마운트 포인트를 만들지 못해 기동에 실패한다.
include /etc/nginx/ssl-conf/*.conf;

server {
    listen 80;
    server_name _;

    # nginx 버전 노출 방지
    server_tokens off;

    # 업로드 크기 제한 (이미지 업로드가 생기면 조정)
    client_max_body_size 10m;

    gzip on;
    gzip_types application/json application/javascript text/plain text/css;
    gzip_min_length 1024;

    # Let's Encrypt HTTP-01 챌린지.
    # certbot이 이 경로 아래에 토큰 파일을 쓰고 CA가 http로 읽어간다.
    # 80을 443으로 리다이렉트하게 된 뒤에도 이 location만은 80에 남아야 한다 —
    # 갱신 때마다 같은 방식으로 다시 검증받기 때문이다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    # 헬스체크는 접근 로그를 남기지 않는다 (컨테이너 헬스체크가 15초마다 호출)
    location = /api/v1/health {
        access_log off;
        proxy_pass http://yaguhae_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
    }

    # API 문서. 앱이 Basic 인증을 걸지만(SWAGGER_USER/SWAGGER_PASSWORD) 여기서도
    # 접근 로그를 남긴다 — 누가 스펙을 긁어가는지는 알고 있어야 한다.
    location /api/docs {
        proxy_pass http://yaguhae_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';

        # 인증 헤더를 업스트림으로 그대로 넘긴다.
        proxy_pass_request_headers on;
    }

    location / {
        proxy_pass http://yaguhae_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # keepalive 업스트림을 쓰므로 Connection 헤더를 비운다.
        proxy_set_header Connection '';

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket이 필요해지면 아래 형태의 location을 추가한다.
    # location /socket.io/ {
    #     proxy_pass http://yaguhae_api;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host $host;
    # }
}
